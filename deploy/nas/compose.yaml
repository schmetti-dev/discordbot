# Buchclub-Bot auf dem NAS.
#
#   cp .env.example .env    # Token eintragen
#   docker compose up -d --build
#
# Zwei Volumes, absichtlich an zwei Orten: die Datenbank liegt bei den
# Diensten, die Sicherung auf der Backup-Freigabe.
services:
  buchketiere:
    build:
      context: ../..
      dockerfile: deploy/nas/Dockerfile
    container_name: buchketiere
    restart: unless-stopped
    env_file: .env
    # Manche NAS-Freigaben lassen nur eine bestimmte Gruppe schreiben.
    group_add:
      - "${EXTRA_GID:-1000}"
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ${BACKUP_HOST_DIR:?Bitte BACKUP_HOST_DIR in .env setzen}:/backup
